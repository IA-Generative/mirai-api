name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    # Only open PRs labelled "preview", and never forks (no access to secrets/packages).
    if: >-
      github.event.action != 'closed' && github.event.action != 'unlabeled' &&
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write
    env:
      IMAGE: ghcr.io/ia-generative/mirai-api-docs
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0 # Dockerfile copies .git (VitePress last-updated)

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Must match ArgoCD's {{ .head_short_sha }} (first 8 chars of the head commit).
      - id: tag
        run: echo "value=pr-${PR}-${SHA::8}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Comment preview URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none \
            --body "🔍 Preview: https://mirai-api-pr-${PR}.preview.mirai-hp.cpin.numerique-interieur.com (commit \`${SHA::8}\`, deployed by ArgoCD in a few minutes)"

  # ArgoCD removes the namespace itself; this removes the PR images from ghcr.
  cleanup:
    if: >-
      (github.event.action == 'closed' ||
        (github.event.action == 'unlabeled' && github.event.label.name == 'preview')) &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
      PACKAGE: /orgs/${{ github.repository_owner }}/packages/container/mirai-api-docs/versions
    steps:
      - name: Delete pr-<n>-* image versions
        run: |
          gh api --paginate "$PACKAGE" \
            --jq ".[] | select(any(.metadata.container.tags[]?; startswith(\"pr-${PR}-\"))) | .id" |
          while read -r id; do
            echo "Deleting version $id"
            gh api -X DELETE "$PACKAGE/$id"
          done
