nameOverride: ''
fullnameOverride: ''
serviceAccount:
  create: false
  annotations: {}
  name: ''
imageCredentials:
  registry: ''
  username: ''
  password: ''
  email: ''
imagePullSecrets:
  - name: registry-pull-secret

docs:
  replicaCount: 1
  image:
    repository: harbor.sdid.cpin.numerique-interieur.com/miraiapi/docs
    pullPolicy: Always
    # Overrides the image tag whose default is the chart appVersion.
    tag: latest
  podAnnotations: {}
  podSecurityContext: {}
  # fsGroup: 2000
  securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000
  container:
    port: 8080
    env: {}
    secrets: {}
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: true
    className: mirai-nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: api.mirai.cpin.numerique-interieur.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: api.mirai.cpin.numerique-interieur.com-tls
        hosts:
          - api.mirai.cpin.numerique-interieur.com
  # Second Ingress, same Service/backend, separate object: a cert-manager
  # cluster-issuer annotation applies to a whole Ingress, not per-host, so a
  # second issuer (HTTP-01 here, vs. DNS-01 for the host above) needs its own
  # Ingress resource rather than another entry under ingress.hosts.
  ingressExtra:
    enabled: true
    className: mirai-nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod-http
    hosts:
      - host: docs.api.mirai.interieur.gouv.fr
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: docs.api.mirai.interieur.gouv.fr-tls
        hosts:
          - docs.api.mirai.interieur.gouv.fr
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  nodeSelector: {}
  tolerations: []
  affinity: {}
