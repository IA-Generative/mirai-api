server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self';" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  # Serve static files and fallback to index.html for SPA
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Health endpoint
  location /healthz {
    access_log off;
    add_header 'Content-Type' 'application/json';
    return 200 '{"status":"UP"}';
  }

  # Deny access to hidden files and sensitive locations
  location ~* \/(\.|_)?(git|env|htaccess|htpasswd|DS_Store) {
    deny all;
  }

  # Limit request size
  client_max_body_size 2M;

  # Disable server tokens
  server_tokens off;
}
